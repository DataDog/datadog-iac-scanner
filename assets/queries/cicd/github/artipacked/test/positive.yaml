name: Insecure Artifact Upload
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with credentials persisted
        uses: actions/checkout@v4

      - name: Build
        run: npm run build

      - name: Upload entire workspace
        uses: actions/upload-artifact@v3
        with:
          name: workspace
          path: .
