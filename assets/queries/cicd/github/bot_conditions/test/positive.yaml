name: Insecure Bot Check
on: pull_request

jobs:
  # Basic bot actor check
  dependabot:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Auto-approve
        run: gh pr review --approve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Reverse equality check
  reverse-equality:
    runs-on: ubuntu-latest
    if: ${{ 'dependabot[bot]' == github.actor }}
    steps:
      - name: Run action
        run: echo "Hello"

  # Triggering actor check
  triggering-actor:
    runs-on: ubuntu-latest
    if: ${{ github.triggering_actor == 'dependabot[bot]' }}
    steps:
      - name: Run action
        run: echo "Hello"

  # PR sender login check
  pr-sender:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.sender.login == 'renovate[bot]' }}
    steps:
      - name: Run action
        run: echo "Hello"

  # Case variations - uppercase ACTOR
  uppercase-actor:
    runs-on: ubuntu-latest
    if: ${{ GitHub.ACTOR == 'dependabot[bot]' }}
    steps:
      - name: Run action
        run: echo "Hello"

  # Case variations - mixed case
  mixed-case:
    runs-on: ubuntu-latest
    if: ${{ GitHub.actor == 'renovate[bot]' }}
    steps:
      - name: Run action
        run: echo "Hello"

  # OR condition (dominating)
  or-condition:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' || github.actor == 'renovate[bot]' }}
    steps:
      - name: Run action
        run: echo "Hello"

  # OR with other condition
  or-with-true:
    runs-on: ubuntu-latest
    if: ${{ 'dependabot[bot]' == github.actor || true }}
    steps:
      - name: Run action
        run: echo "Hello"

  # OR with false
  or-with-false:
    runs-on: ubuntu-latest
    if: ${{ 'dependabot[bot]' == github.actor || false }}
    steps:
      - name: Run action
        run: echo "Hello"

  # AND condition (non-dominating) at step level
  and-condition:
    runs-on: ubuntu-latest
    steps:
      - name: Bot step
        if: ${{ github.actor == 'dependabot[bot]' && contains(github.event.pull_request.title, 'dependencies') }}
        run: echo "Hello"

  # Actor ID check - dependabot integration ID
  actor-id-integration:
    runs-on: ubuntu-latest
    if: ${{ github.actor_id == '29110' }}
    steps:
      - name: Run action
        run: echo "Hello"

  # Actor ID check - dependabot[bot] user ID
  actor-id-user:
    runs-on: ubuntu-latest
    if: ${{ github.actor_id == '49699333' }}
    steps:
      - name: Run action
        run: echo "Hello"

  # Actor ID check - renovate[bot]
  actor-id-renovate:
    runs-on: ubuntu-latest
    if: ${{ github.actor_id == '29139614' }}
    steps:
      - name: Run action
        run: echo "Hello"

  # PR sender ID check
  pr-sender-id:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.sender.id == '49699333' }}
    steps:
      - name: Run action
        run: echo "Hello"

  # Multiple steps with bot conditions
  multi-step-bot:
    runs-on: ubuntu-latest
    steps:
      - name: First bot step
        if: ${{ github.actor == 'dependabot[bot]' }}
        run: echo "Step 1"

      - name: Second bot step
        if: ${{ github.triggering_actor == 'renovate[bot]' }}
        run: echo "Step 2"

      - name: Third bot step with AND
        if: ${{ github.actor == 'dependabot[bot]' && github.event_name == 'pull_request' }}
        run: echo "Step 3"
