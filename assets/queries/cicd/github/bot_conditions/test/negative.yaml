name: Secure Bot Check
on: pull_request

jobs:
  # Secure: checks both name AND ID
  dependabot:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' && github.actor_id == '49699333' }}
    steps:
      - name: Auto-approve
        run: gh pr review --approve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Secure: no bot condition at all
  no-bot-check:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Run action
        run: echo "Hello"

  # Secure: negated bot condition (checking it's NOT a bot)
  not-a-bot:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - name: Run action
        run: echo "Hello"

  # Secure: using event-specific user context
  event-specific-context:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Run action
        run: echo "Hello"

  # Secure: multiple checks with AND including ID
  multi-check-secure:
    runs-on: ubuntu-latest
    if: ${{ github.triggering_actor == 'renovate[bot]' && github.actor_id == '29139614' }}
    steps:
      - name: Run action
        run: echo "Hello"

  # Secure: no condition at all
  unconditional:
    runs-on: ubuntu-latest
    steps:
      - name: Always run
        run: echo "Hello"

  # Secure: condition doesn't involve bot checks
  non-bot-condition:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch
        if: ${{ github.ref == 'refs/heads/main' }}
        run: echo "Hello"

      - name: Check event
        if: ${{ github.event_name == 'push' }}
        run: echo "Hello"

  # Secure: negated with NOT operator
  negated-with-not:
    runs-on: ubuntu-latest
    if: ${{ !(github.actor == 'dependabot[bot]') }}
    steps:
      - name: Run action
        run: echo "Hello"

  # Secure: bot check with proper ID verification (reverse equality)
  reverse-secure:
    runs-on: ubuntu-latest
    if: ${{ 'dependabot[bot]' == github.actor && '49699333' == github.actor_id }}
    steps:
      - name: Run action
        run: echo "Hello"
