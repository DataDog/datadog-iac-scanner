name: Composite action with github-script using github.event.inputs
description: Composite action that runs github-script with workflow input via github.event.inputs
runs:
  using: composite
  steps:
    - name: Run script
      uses: actions/github-script@v7
      with:
        script: |
          const body = `${{ github.event.inputs.foo }}`;
          core.info(body);
