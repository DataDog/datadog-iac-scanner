name: Safe Pull Request Workflow

on:
  pull_request:
    branches: [main]

jobs:
  test_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run safe commands
        run: |
          echo "Running tests"
          make test

      - name: Build project
        run: |
          npm install
          npm run build
