name: Workflow with tainted step env interpolation
on:
  workflow_dispatch:
    inputs:
      title:
        description: Title
        required: true

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Echo tainted env
        env:
          MESSAGE: ${{ github.event.inputs.title }}
        run: echo "${{ env.MESSAGE }}"
