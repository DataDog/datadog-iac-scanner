name: Composite action writing to GITHUB_ENV
description: Composite action that writes attacker-influenced content to GITHUB_ENV
inputs:
  message:
    description: Untrusted input
    required: true
runs:
  using: composite
  steps:
    - name: Unsafe redirect
      shell: bash
      env:
        MSG: ${{ inputs.message }}
      run: echo $MSG >> $GITHUB_ENV
