name: test-rego-libraries

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "assets/libraries/**/*.rego"
      - ".github/workflows/test-rego-libraries.yml"
  push:
    branches:
      - main
    paths:
      - "assets/libraries/**/*.rego"

permissions:
  contents: read

jobs:
  test-rego-libraries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download and install OPA
        run: |
          OPA_VERSION="0.49.2"
          curl -L -o opa "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x opa
          sudo mv opa /usr/local/bin/
          opa version

      - name: Run OPA tests
        run: |
          cd assets/libraries
          opa test . -v
