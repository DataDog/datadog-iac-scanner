name: Test Gate

# This workflow blocks PRs from being merged to main if tests in critical packages fail.
# TODO: Expand gate to include all critical packages once their tests are fixed
# TODO: Expand gate to run ALL tests once their tests are fixed
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:  # Allow manual trigger from Actions tab

permissions:
  contents: read        # Read access to checkout code
  pull-requests: write  # Write access to post PR comments

jobs:
  critical-tests:
    name: Critical Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Get dependencies
        run: go mod download

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run critical tests
        id: engine-tests
        run: |
          echo "🔍 Running critical tests..."
          gotestsum --format testname -- -v -short -timeout 15m ./pkg/engine ./pkg/runner ./pkg/analyzer ./pkg/parser ./pkg/parser/terraform/... ./pkg/parser/yaml ./pkg/engine/source ./pkg/scan ./pkg/scanner ./pkg/builder/... ./test/e2e ./pkg/utils ./test/... ./pkg/report/model
          echo "✅ All critical tests passed!"

      - name: Comment on PR (on failure)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Critical Tests Failed**\n\nOne or more critical test suites failed. These packages are critical to the security scanning functionality.\n\n**This PR cannot be merged until these tests pass.**\n\nPlease review the test failures and fix the issues.\n\n[View workflow run](${context.serverUrl}/${context.repo().owner}/${context.repo().repo}/actions/runs/${context.runId})`
            })

      - name: Set status
        if: failure()
        run: |
          echo "::error::Critical tests failed - blocking merge"
          exit 1
