name: validate-metadata

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "assets/queries/**/metadata.json"
      - ".github/scripts/metadata-validation/**"
      - ".github/workflows/validate-metadata.yml"

jobs:
  validate-metadata-files:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Make validation script executable
        run: chmod +x .github/scripts/metadata-validation/validate_metadata.py

      - name: Validate metadata.json files
        run: |
          python3 .github/scripts/metadata-validation/validate_metadata.py \
            --base-path . \
            --verbose
